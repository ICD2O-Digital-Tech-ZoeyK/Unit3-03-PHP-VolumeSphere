<!DOCTYPE html>
<html lang="en">
  <head>
      <!-- Meta data section -->
    <meta charset="utf-8">
    <meta name="description" content="Cold Hot webpage">
    <meta name="keywords" content="immaculata, ics2o">
    <meta name="author" content="Zoey Kariyal">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="./favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon/favicon-16x16.png">
    <link rel="manifest" href="./favicon/site.webmanifest">

    <link rel="stylesheet" href="./css/style.css">
  
    <title>Sphere Volume Calculator (PHP)</title>

    <!-- MDL & Custom Styles -->
    <link rel="stylesheet" href="https://code.getmdl.io/1.3.0/material.indigo-pink.min.css">
    <script defer src="https://code.getmdl.io/1.3.0/material.min.js"></script>

  </head>
  <body>

   <!-- Page Layout -->
   <div class="mdl-layout mdl-js-layout mdl-layout--fixed-header">
     <header class="mdl-layout__header custom-header">
        <div class="mdl-layout__header-row">
          <span class="mdl-layout-title">Sphere Volume Calculator</span>
        </div>
      </header>

      <main class="mdl-layout__content">
        <div class="page-content">

          <!-- Main Form -->
          <div class="mdl-grid">
            <div class="mdl-cell mdl-cell--4-col mdl-cell--4-offset">

              <!-- Form that posts to calculate.php -->
              <form method="POST" action="./php/calculate.php">
                <div class="mdl-textfield mdl-js-textfield mdl-textfield--floating-label">
                  <input class="mdl-textfield__input" type="number" name="radius" id="radius" step="any" required>
                  <label class="mdl-textfield__label" for="radius">Enter Radius (r)</label>
                </div>

                <button class="mdl-button mdl-js-button mdl-button--raised mdl-button--colored custom-button" type="submit">
                  Calculate Volume
                </button>
              </form>

            </div>
          </div>

        </div>
      </main>
    </div>

    <!-- Custom JS -->
    <script src="./js/script.js"></script>
  </body>
</html>
